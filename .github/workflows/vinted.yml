name: Vinted Monitor Bot 1.0

on:
  workflow_dispatch: # Trigger per l'avvio da cron-job.org

# Diamo al bot il permesso di leggere e scrivere file nel repository
permissions:
  contents: write

# ⚡ NUOVO: Evita che due bot partano in contemporanea causando blocchi 403 o conflitti Git
concurrency:
  group: vinted-bot-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4
        with:
          # Importante per permettere all'azione successiva di fare push correttamente
          fetch-depth: 0 

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Salva le dipendenze in memoria per velocizzare l'avvio

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ritardo casuale anti-ban
        # Attesa tra 15 e 30 secondi per variare il pattern di richiesta
        run: sleep $((RANDOM % 16 + 15))

      - name: Esegui lo script Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHAT_ID_AA: ${{ secrets.CHAT_ID_AA }}
          TZ: "Europe/Rome" # Fissa l'orario italiano per il resoconto di mezzanotte
        run: python bot.py

      - name: Salva gli articoli già visti e il log
        # ⚡ MIGLIORATO: Rimosso file_pattern. Ora committa automaticamente tutto ciò che è cambiato.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Aggiornata memoria bot e resoconto"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
